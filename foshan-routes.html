  option('stay','住宿建议 · 张槎—智慧新城／季华二路');
  option('fair','27日出发 · 广交会／琶洲片区');
  points.forEach(p=>option(p.id,`${p.day}·${p.order} ${p.name}｜${p.product}${p.coord?'':'（定位待补）'}`));
  let selected='stay',transform=d3.zoomIdentity,projection,path,width,height;
  const initial=window.openai?.widgetState;
  if(initial?.modelContent?.selectedId && byId[initial.modelContent.selectedId])selected=initial.modelContent.selectedId;
  function persist(){
    if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{selectedId:selected,selectedPlace:byId[selected].name,dates:['2026-10-27','2026-10-28','2026-10-29']},privateContent:null}).catch(()=>{});
  }
  function detailLine(text,strong=false){const el=document.createElement(strong?'strong':'div');el.textContent=text;detail.append(el)}
  function showDetail(){
    select.value=selected;detail.replaceChildren();
    if(selected==='stay'){
      detailLine('首选住宿片区：禅城西侧，张槎—智慧新城／季华二路',true);
      detailLine('建议27—29日连住3晚；酒店待选。图中圆环以两座地铁站附近为找房范围，约1.5公里，不是酒店位置。');
    }else if(selected==='fair'){
      detailLine('27日 · 广交会收尾 → 富轩（可选）→ 住宿片区',true);
      detailLine('起点用新港东站标示琶洲片区，展馆离场出口及上车点待定。');
    }else{
      const p=byId[selected];detailLine(`${p.day}·${p.order} ${p.name}｜${p.product}`,true);
      detailLine(p.address);
      detailLine(`${p.place_type} · ${p.visit_status}。${p.id==='25'?'精确定位待补，暂不落图。':p.id==='08'?'可参观生产，无展厅；厂门入口待确认。':p.address_status}`);
    }
  }
  function choose(id,save=true){selected=id;showDetail();drawForeground();if(save)persist()}
  const zoom=d3.zoom().scaleExtent([1,5]).on('zoom',e=>{transform=e.transform;svg.select('.basemap-layer').attr('transform',transform);drawForeground()});
  const project=c=>transform.apply(projection(c));
  const distanceKm=(a,b)=>d3.geoDistance(a,b)*6371;
  function drawForeground(){
    if(!projection)return;
    svg.selectAll('.foreground-layer').remove();
    const layer=svg.append('g').attr('class','foreground-layer');
    const routeLayer=layer.append('g');
    for(const r of routes){
      const xy=r.ids.map(id=>project(byId[id].coord));
      routeLayer.append('path').attr('d',d3.line()(xy)).attr('fill','none').attr('stroke',colors[r.day]).attr('stroke-width',2.5).attr('stroke-opacity',.88).attr('stroke-dasharray',r.gap?'5 5':null);
      for(let i=1;i<xy.length;i++){
        const a=xy[i-1],b=xy[i],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);
        if(len<18)continue;
        const x=a[0]+dx*.6,y=a[1]+dy*.6,ux=dx/len,uy=dy/len;
        routeLayer.append('path').attr('d',`M${x-6*ux+3*uy},${y-6*uy-3*ux}L${x},${y}L${x-6*ux-3*uy},${y-6*uy+3*ux}`).attr('fill','none').attr('stroke',colors[r.day]).attr('stroke-width',2);
      }
    }
    const stayCircle=d3.geoCircle().center(stayCenter).radius(1.5/6371*180/Math.PI)();
    layer.append('path').datum(stayCircle).attr('d',path).attr('transform',transform).attr('fill','var(--foreground)').attr('fill-opacity',.07).attr('stroke','var(--foreground)').attr('stroke-opacity',.7).attr('stroke-width',1.5/transform.k).attr('stroke-dasharray',`${4/transform.k} ${3/transform.k}`);
    const anchors=[{name:'祖庙',coord:station(6491001286)},{name:'千灯湖',coord:station(6491001183)}];
    const labelItems=[];
    for(const a of anchors){
      const [x,y]=project(a.coord);layer.append('circle').attr('cx',x).attr('cy',y).attr('r',3).attr('fill','var(--muted-foreground)');
      if(width>460)labelItems.push({...a,x,y,text:a.name,secondary:true});
    }
    for(const p of allPoints){
      const [x,y]=project(p.coord);if(x<-20||x>width+20||y<-20||y>height+20)continue;
      const isStay=p.id==='stay',isFair=p.id==='fair',color=isStay||isFair?'var(--foreground)':colors[p.day];
      if(selected===p.id)layer.append('circle').attr('cx',x).attr('cy',y).attr('r',17).attr('fill','none').attr('stroke',color).attr('stroke-opacity',.4).attr('stroke-width',2);
      layer.append('circle').attr('cx',x).attr('cy',y).attr('r',isStay?7:11).attr('fill','var(--background)').attr('stroke',color).attr('stroke-width',2.5);
      if(!isStay)layer.append('text').attr('x',x).attr('y',y+4).attr('text-anchor','middle').text(isFair?'起':p.order);
      labelItems.push({...p,x,y,text:isStay?'住宿首选 · 张槎—智慧新城':isFair?'27日出发 · 琶洲':`${p.day}·${p.order} ${p.name}`});
    }
    const occupied=[{x:0,y:0,w:175,h:53},{x:width-100,y:0,w:100,h:50}];
    for(const p of allPoints){const [x,y]=project(p.coord);occupied.push({x:x-12,y:y-12,w:24,h:24})}
    const fits=r=>r.x>=7&&r.y>=7&&r.x+r.w<=width-7&&r.y+r.h<=height-30&&!occupied.some(a=>r.x<a.x+a.w+4&&r.x+r.w+4>a.x&&r.y<a.y+a.h+4&&r.y+r.h+4>a.y);
    labelItems.sort((a,b)=>(a.secondary?1:0)-(b.secondary?1:0));
    for(const p of labelItems){
      const t=layer.append('text').attr('class','map-label').text(p.text);
      const tw=t.node().getComputedTextLength();
      const positions=[[16,-7],[16,16],[-tw-16,-7],[-tw-16,18],[-tw/2,-28],[-tw/2,35],[16,-42],[-tw-16,47],[16,53],[-tw-16,-56],[-tw/2,70]];
      let chosen=null;
      for(const [dx,dy]of positions){const r={x:p.x+dx,y:p.y+dy-12,w:tw,h:16};if(fits(r)){chosen=r;break}}
      if(!chosen && !p.secondary){
        const free=[];
        for(let y=60;y<height-45;y+=20)for(let x=8;x<width-tw-8;x+=20){const r={x,y,w:tw,h:16};if(fits(r))free.push(r)}
        free.sort((a,b)=>Math.hypot(a.x+tw/2-p.x,a.y-p.y)-Math.hypot(b.x+tw/2-p.x,b.y-p.y));chosen=free[0];
      }
      if(!chosen){t.remove();continue}
      occupied.push(chosen);t.attr('x',chosen.x).attr('y',chosen.y+12);
      const tx=Math.max(chosen.x,Math.min(chosen.x+tw,p.x)),ty=Math.max(chosen.y,Math.min(chosen.y+16,p.y));
      if(Math.hypot(tx-p.x,ty-p.y)>25)layer.insert('line','text').attr('x1',p.x).attr('y1',p.y).attr('x2',tx).attr('y2',ty).attr('stroke','var(--muted-foreground)').attr('stroke-width',.8);
    }
    const scaleLat=stayCenter[1],kmPerDegree=distanceKm([stayCenter[0],scaleLat],[stayCenter[0]+.1,scaleLat])/.1;
    const a=project(stayCenter),b=project([stayCenter[0]+5/kmPerDegree,scaleLat]),bar=Math.abs(b[0]-a[0]);
    if(bar<width*.5){layer.append('path').attr('d',`M12,${height-17}h${bar}`).attr('stroke','var(--foreground)').attr('stroke-width',2);layer.append('text').attr('x',12).attr('y',height-25).attr('class','map-label').text('5公里')}
    layer.append('text').attr('x',width-22).attr('y',height-18).attr('class','map-label').text('北 ↑').attr('text-anchor','end');
  }
  function draw(){
    width=Math.round(root.querySelector('.map-area').getBoundingClientRect().width);
    if(width<100)return;
    height=width<470?510:490;
    svg.attr('viewBox',`0 0 ${width} ${height}`).attr('height',height);
    projection=d3.geoMercator().fitExtent([[34,73],[width-40,height-67]],{type:'MultiPoint',coordinates:allPoints.map(p=>p.coord)});
    path=d3.geoPath(projection);svg.selectAll('*').remove();
    svg.append('title').text('佛山三天看厂与住宿位置');
    svg.append('desc').text('27日琶洲到大沥富轩后入住禅城；28日盈加、大浩湖待定位、富贵花、ARTIDES；29日森可、惠璞、观邸维娜斯、袁哥。首选住宿张槎至智慧新城。线条表示拜访顺序，不是道路导航。');
    const base=svg.append('g').attr('class','basemap-layer').attr('transform',transform);
    const order=['water','primary','trunk','motorway'];
    order.forEach(kind=>base.selectAll(`.base-${kind}`).data(geo.features.filter(f=>f.properties.kind===kind)).join('path').attr('class',`base-${kind}`).attr('d',path).attr('fill','none').attr('stroke',kind==='water'?'var(--blue)':'var(--muted-foreground)').attr('stroke-opacity',kind==='water'?.22:kind==='primary'?.15:.23).attr('stroke-width',kind==='water'?2:kind==='motorway'?1.1:.7));
    zoom.extent([[0,0],[width,height]]).translateExtent([[-width*.3,-height*.3],[width*1.3,height*1.3]]);
    svg.call(zoom).on('dblclick.zoom',null).on('click.select',event=>{
      if(event.defaultPrevented)return;const xy=d3.pointer(event);
      const p=allPoints.map(p=>({p,dist:Math.hypot(...project(p.coord).map((v,i)=>v-xy[i]))})).sort((a,b)=>a.dist-b.dist)[0];
      if(p&&p.dist<26)choose(p.p.id);
    });
    drawForeground();
  }
  root.querySelector('[data-zoom="in"]').addEventListener('click',()=>svg.call(zoom.scaleBy,1.5));
  root.querySelector('[data-zoom="out"]').addEventListener('click',()=>svg.call(zoom.scaleBy,1/1.5));
  root.querySelector('[data-zoom="home"]').addEventListener('click',()=>svg.call(zoom.transform,d3.zoomIdentity));
  select.addEventListener('change',()=>choose(select.value));
  window.addEventListener('openai:set_globals',event=>{const id=event.detail?.globals?.widgetState?.modelContent?.selectedId;if(id&&byId[id])choose(id,false)});
  showDetail();new ResizeObserver(draw).observe(root.querySelector('.map-area'));draw();
})();
</script>

<script>(() => {
  const root=document.getElementById('foshan-three-day-routes');
  let lastHeight=0;
  function updateHeight(){
    const height=Math.ceil(root.getBoundingClientRect().bottom+18);
    if(height===lastHeight||window.parent===window)return;
    lastHeight=height;
    window.parent.postMessage({type:'foshan-route-height',height},location.origin);
  }
  new ResizeObserver(updateHeight).observe(root);
  window.addEventListener('load',updateHeight);
  updateHeight();
})();
</script></body></html>
