  function delegatedClick(e){
    if(e.target.classList.contains('modal-wrap')){closeModal();return}
    const el=e.target.closest('[data-page],[data-share],[data-goto-day],[data-date],[data-vendor],[data-filter],[data-close],[data-copy]');if(!el)return;

    if(el.hasAttribute('data-goto-day')){navigate('days',el.getAttribute('data-goto-day'));return}
    if(el.hasAttribute('data-page')){e.preventDefault();navigate(el.getAttribute('data-page'));return}

  function bootstrap(){app=document.getElementById('app'); if(!app){throw new Error('缺少网页容器 #app');} if(!window.TRIP_DATA){app.innerHTML='<div class="load-error">未能读取行程数据，请确认trip-data.js存在。</div>';return}D=window.TRIP_DATA;parseHash();document.addEventListener('click',delegatedClick);document.addEventListener('input',e=>{if(e.target.id==='vendor-search'){state.query=e.target.value;renderVendors()}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});window.addEventListener('hashchange',()=>{if(state.openedVendor)closeModal();parseHash();render()});render()}
  window.TripApp={bootstrap};
})();
</script>
