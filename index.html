    <div class="dual"><div class="soft-card"><h3>重要日程</h3><p>各项活动以你最后确认和预订结果为准。</p><div class="mini-list">${highlights.map(([time,title,desc])=>`<div class="mini-item"><div class="mini-icon">${icon(title.includes('新荣记')?'pin':title.includes('西安')?'plane':'calendar','sm')}</div><div><strong>${esc(time)} · ${esc(title)}</strong><div class="subtle">${esc(desc)}</div></div></div>`).join('')}</div></div>
    <div class="soft-card"><h3>出发前最重要的三件事</h3><p>保证行程能顺利落地，优先处理这些事项。</p><div class="mini-list">${D.todos.slice(0,3).map(t=>`<div class="quick-check"><span class="small-bullet"></span><div><strong>${esc(t.title)}</strong><p>${esc(t.detail)}</p><span class="quick-tag">${esc(t.deadline)}</span></div></div>`).join('')}</div><div class="info-foot">${icon('alert','sm')} 尚未确认的航班或工厂，网站会明确标注为候选。</div></div></div>
    <div class="heading-row"><div><div class="eyebrow">LATEST UPDATES</div><h2>最近更新</h2></div></div><div class="soft-card change-log">${D.changes.slice(0,4).map(c=>`<div class="change-row"><span class="change-dot"></span><div><strong>${esc(c.title)}</strong><p>${esc(c.text)}</p><small>${esc(c.date)}</small></div></div>`).join('')}</div>`;
  }
  function renderDay(day){
    const s=stat[day.state]||stat.open;
    let chips='';
    if(day.suppliers?.length){chips=`<div class="supplier-chips"><span class="tiny muted" style="width:100%;padding-bottom:4px">当天可考虑的供应商（均待预约）</span>${day.suppliers.map(id=>{const v=D.suppliers.find(x=>x.id===id);return v?`<button type="button" data-vendor="${esc(id)}">${esc(id)} ${esc(v.name)}</button>`:''}).join('')}</div>`}
    return `<div class="day-detail"><div class="day-photo">${photo(day.area)}<span class="day-photo-gradient"></span><div class="day-cover-content"><span class="eyebrow">${esc(day.day)} · ${esc(day.weekday)}</span><h2>${esc(day.city)}</h2><span class="tiny">${esc(day.highlight)}</span></div></div><div class="day-body"><div class="day-summary"><div><b>当天安排</b><div class="subtle">${day.events.length}项安排 · 当地时间</div></div>${pill(...s)}</div><ol class="timeline">${day.events.map(e=>`<li><span class="time-col">${esc(e.time)}</span><span class="time-dot"></span><div class="time-content"><strong>${esc(e.title)}</strong>${e.desc?`<p>${esc(e.desc)}</p>`:''}${e.place?`<a class="location-link" target="_blank" rel="noopener noreferrer" href="${mapURL(e.place)}">${icon('pin','sm')} ${esc(e.place)} · 查看地图</a>`:''}${e.link?`<a class="location-link" target="_blank" rel="noopener noreferrer" href="${esc(e.link)}">官方入口 ${icon('arrow','sm')}</a>`:''}</div></li>`).join('')}</ol>${chips}<div class="daily-footer"><span>后续补充可继续按日期更新</span><span>${esc(D.meta.revision)}</span></div></div></div>`;
  }
  function dayView(){
    const day=dates().find(x=>x.date===state.date)||dates()[0];
    const strip=dates().map(x=>`<button type="button" data-date="${x.date}" class="day-pill ${x.date===day.date?'selected':''}" aria-pressed="${x.date===day.date?'true':'false'}"><span>${esc(x.weekday)}</span><b>${esc(x.day.split('/')[1])}</b>${x.events.length?'<i></i>':''}</button>`).join('');
    const rows=dates().map(x=>`<button type="button" class="day-row ${x.date===day.date?'active':''}" data-date="${x.date}"><span class="date-square"><b>${esc(x.day.split('/')[1])}</b><small>${esc(x.weekday)}</small></span><span class="row-main"><b>${esc(x.city)}</b><p>${esc(x.highlight)}</p></span>${icon('chevron','sm')}</button>`).join('');
    return `<div class="title-head"><div><div class="eyebrow">DAY BY DAY</div><h1>每日行程</h1><p>点选日期，查看具体安排、工厂候选及地图入口。</p></div>${pill('22天','blue')}</div><div class="day-strip" id="day-strip">${strip}</div><div id="selected-day">${renderDay(day)}</div><div class="heading-row"><div><div class="eyebrow">ALL DAYS</div><h2>22天日程速览</h2></div></div><div class="day-rows">${rows}</div>`;
  }
  function vendorCard(v){
    const vs=vdstatus[v.status]||vdstatus.wait;
    return `<article class="vendor"><div class="vendor-top"><div class="vendor-art">${icon('factory','lg')}</div><div style="min-width:0"><div class="vendor-title"><span class="id">${esc(v.id)}</span>${esc(v.name)}</div><div class="subtle" style="margin-top:4px">${esc(v.city)}${v.region?' · '+esc(v.region):''}</div></div></div><div class="vendor-mid">${esc(v.product)}</div><div>${pill(...vs)}</div>${v.address?`<div class="vendor-location">${icon('pin','sm')}<span>${esc(v.address)}<br><span class="tiny">${esc(v.addressType)}</span></span></div>`:`<div class="vendor-location">${icon('alert','sm')}<span>尚无可核实的工厂详细地址</span></div>`}<div class="vendor-bottom"><span class="subtle">${esc(v.contactState||'尚未预约')}</span><button type="button" data-vendor="${esc(v.id)}" class="text-button">查看详情 ${icon('chevron','sm')}</button></div></article>`;
  }
  function getFiltered(){return D.suppliers.filter(v=>{
    const c=state.city;
    const regionMatch=(c==='全部'||(c==='福州'&&v.city.includes('福州'))||(c==='佛山'&&v.city.includes('佛山'))||(c==='华东'&&/(杭州|南京)/.test(v.city))||(c==='待定位'&&v.city==='待定位'));
    const q=state.query.trim().toLowerCase();
    return regionMatch&&(!q||[v.id,v.name,v.product,v.city,v.region,v.address].join(' ').toLowerCase().includes(q));
  })}
  function vendorsView(){
    const cats=['全部','佛山','福州','华东','待定位'];
    return `<div class="title-head"><div><div class="eyebrow">FACTORY VISITS</div><h1>供应商清单</h1><p>15家小红书商家＋7家福州本地工厂线索。按工厂证据与地址核实。</p></div>${pill('22家','blue')}</div><div class="supplier-tip">${icon('info','sm')}<span>本清单均为<strong>考察候选</strong>，商家自述生产、展厅位置或微信定位，不等于已经验厂或预约成功。</span></div><label class="search-wrap" for="vendor-search">${icon('search')}<input id="vendor-search" type="search" placeholder="搜索名称、编号、材料或地址" value="${esc(state.query)}" autocomplete="off"></label><div class="filters">${cats.map(c=>`<button type="button" data-filter="${esc(c)}" class="filter ${state.city===c?'active':''}" aria-pressed="${state.city===c}">${esc(c)}</button>`).join('')}</div><p class="result-count" id="result-count"></p><div id="supplier-results" class="supplier-list"></div>`;
  }
  function renderVendors(){const target=document.getElementById('supplier-results');if(!target)return;const a=getFiltered();document.getElementById('result-count').textContent=`共 ${a.length} 家符合筛选条件`;target.innerHTML=a.length?a.map(vendorCard).join(''):'<div class="empty">没有找到匹配的商家。请调整地区或搜索关键词。</div>'}
  function flights(){return D.flights.map(f=>`<div class="booking-card"><div class="flight-top"><span class="flight-no">${esc(f.flight)}</span>${pill(f.status.includes('已暂选')?'暂选待买':'待核',f.status.includes('已暂选')?'blue':'wait')}</div><div class="subtle" style="margin-top:4px">${esc(f.date)} · ${esc(f.status)}</div><div class="flight-route"><span>${esc(f.from)}</span><span class="route-line">${icon('plane','sm')}</span><span>${esc(f.to)}</span></div><div class="flight-time">${esc(f.time)}</div></div>`).join('')}
  function bookingsView(){
    return `<div class="title-head"><div><div class="eyebrow">PLAN & BOOKINGS</div><h1>交通与预订</h1><p>已订、暂选及尚未核实的项目明确区分。</p></div>${pill('持续更新','blue')}</div>
    <div class="heading-row"><div><div class="eyebrow">FLIGHTS</div><h2>已知航班与转场</h2></div></div><div class="booking-grid">${flights()}</div>
    <div class="heading-row"><div><div class="eyebrow">HOTELS</div><h2>住宿状态</h2></div></div><div class="soft-card">${D.hotels.map(h=>`<div class="stay-row"><div><b>${esc(h.date)} · ${esc(h.city)}</b><small>${esc(h.name)}</small></div>${pill(h.status,h.tag==='booked'?'booked':h.tag==='known'?'plan':'open')}</div>`).join('')}</div>
    <div class="heading-row"><div><div class="eyebrow">BEFORE YOU GO</div><h2>执行清单</h2></div></div><div class="todo-list">${D.todos.map(t=>`<div class="todo-row"><div><b>${esc(t.title)}</b><p>${esc(t.detail)}</p></div><span class="quick-tag">${esc(t.deadline)}</span></div>`).join('')}</div>
    <div class="soft-card" style="margin-top:20px"><h3>预订与参观原则</h3><p>10月30和31日晚广州酒店已订；11月10日新荣记尚未预约；11月1日CZ3203只是暂定。工厂须有真实生产或加工车间，且实际参观时间以厂家回复为准。</p></div>`;
  }
  function modalVendor(id){
    const v=D.suppliers.find(x=>x.id===id);if(!v)return;
    state.openedVendor=id;
    const vs=vdstatus[v.status]||vdstatus.wait;
    let actions='';
    if(v.xhs)actions+=`<a class="button-primary" href="${esc(v.xhs)}" target="_blank" rel="noopener noreferrer">小红书主页 ${icon('arrow','sm')}</a>`;
    if(v.address)actions+=`<a class="button-secondary" href="${mapURL(v.address)}" target="_blank" rel="noopener noreferrer">地图搜索 ${icon('pin','sm')}</a>`;
    if(v.contact){const num=v.contact.match(/[\d-]{7,}/)?.[0];if(num)actions+=`<a class="button-secondary" href="tel:${num.replace(/-/g,'')}">${icon('phone','sm')} 拨打电话</a>`;}
    const r=document.getElementById('vendor-modal');if(!r)return;
    r.innerHTML=`<div class="modal" tabindex="-1"><div class="modal-header"><div><div class="eyebrow">SUPPLIER ${esc(v.id)}</div><h2>${esc(v.name)}</h2>${pill(...vs)}</div><button type="button" class="modal-close" data-close="1" aria-label="关闭详情">${icon('x')}</button></div>
    ${[['经营产品',v.product],['城市与片区',v.city+(v.region?' · '+v.region:'')],['现有地址',v.address||'暂无工厂详细地址'],['地址证据类型',v.addressType||'暂无已核实工厂地址'],['联系电话',v.contact||'尚未获取'],['联系进度',v.contactState||'待联系'],['商家资料／限制',v.note||'尚无补充说明'],['下一步要确认',v.next||'核实厂址与参观安排']].map(([k,val])=>`<div class="modal-section"><div class="modal-key">${esc(k)}</div><div class="modal-val">${esc(val)}</div></div>`).join('')}<div class="modal-actions">${actions}${v.address?`<button type="button" class="button-secondary" data-copy="${esc(v.address)}">${icon('copy','sm')} 复制地址</button>`:''}</div><p class="fine-print" style="margin-top:18px">提示：地图按钮仅搜索商家提供的地址，并未独立验厂；当前没有已确认的到访预约。</p></div>`;
    r.classList.add('open');document.body.style.overflow='hidden';r.querySelector('.modal').focus();
  }
  function closeModal(){const m=document.getElementById('vendor-modal');if(m){m.classList.remove('open');m.innerHTML=''}state.openedVendor=null;document.body.style.overflow='';}
  function mapURL(addr){return 'https://uri.amap.com/search?keyword='+enc(addr)+'&view=map&callnative=1&src=worktrip2026'}
  function showToast(message){const t=document.getElementById('toast');if(!t)return;t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
  async function copy(str){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(str)}else{const ta=document.createElement('textarea');ta.value=str;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}showToast('已复制')}catch(e){showToast('复制未成功，可长按内容手动复制')}}
  async function share(){if(location.protocol==='file:'){showToast('这是本地预览，部署后才能复制分享网址');return}const opts={title:D.meta.title,text:'2026年10月21日—11月11日同行行程',url:location.href};try{if(navigator.share&&/Android|iPhone|iPad/i.test(navigator.userAgent)){await navigator.share(opts)}else await copy(location.href)}catch(e){if(e.name!=='AbortError')await copy(location.href)}}
  function navigate(page,date){if(date)state.date=date;state.page=page;history.replaceState(null,'',`#/${page}${page==='days'?'/'+state.date:''}`);render();window.scrollTo({top:0,behavior:'instant'})}
  function render(){let body=state.page==='days'?dayView():state.page==='vendors'?vendorsView():state.page==='bookings'?bookingsView():overView();pageShell(body);if(state.page==='vendors')renderVendors();if(state.page==='days'){const sel=document.querySelector('.day-pill.selected');sel?.scrollIntoView({block:'nearest',inline:'center'})}}
  function parseHash(){const match=location.hash.match(/^#\/(overview|days|vendors|bookings)(?:\/(\d{4}-\d{2}-\d{2}))?/);if(match){state.page=match[1];if(match[2]&&D.days.find(x=>x.date===match[2]))state.date=match[2]}}
  function delegatedClick(e){
    if(e.target.classList.contains('modal-wrap')){closeModal();return}
    const el=e.target.closest('[data-page],[data-share],[data-goto-day],[data-date],[data-vendor],[data-filter],[data-close],[data-copy]');if(!el)return;
    if(el.hasAttribute('data-close')){closeModal();return}
    if(el.hasAttribute('data-copy')){copy(el.getAttribute('data-copy'));return}
    if(el.hasAttribute('data-share')){share();return}
    if(el.hasAttribute('data-vendor')){modalVendor(el.getAttribute('data-vendor'));return}
    if(el.hasAttribute('data-filter')){state.city=el.getAttribute('data-filter');document.querySelectorAll('[data-filter]').forEach(x=>{const yes=x.getAttribute('data-filter')===state.city;x.classList.toggle('active',yes);x.setAttribute('aria-pressed',String(yes))});renderVendors();return}
    if(el.hasAttribute('data-date')){state.date=el.getAttribute('data-date');history.replaceState(null,'',`#/days/${state.date}`);const display=document.getElementById('selected-day');if(display)display.innerHTML=renderDay(D.days.find(x=>x.date===state.date));document.querySelectorAll('[data-date]').forEach(x=>{x.classList.toggle('selected',x.getAttribute('data-date')===state.date);x.classList.toggle('active',x.getAttribute('data-date')===state.date)});document.querySelector('.day-pill.selected')?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});document.getElementById('selected-day')?.scrollIntoView({block:'start',behavior:'smooth'});return}
    if(el.hasAttribute('data-goto-day')){navigate('days',el.getAttribute('data-goto-day'));return}
    if(el.hasAttribute('data-page')){e.preventDefault();navigate(el.getAttribute('data-page'));return}
  }
  function bootstrap(){app=document.getElementById('app'); if(!app){throw new Error('缺少网页容器 #app');} if(!window.TRIP_DATA){app.innerHTML='<div class="load-error">未能读取行程数据，请确认trip-data.js存在。</div>';return}D=window.TRIP_DATA;parseHash();document.addEventListener('click',delegatedClick);document.addEventListener('input',e=>{if(e.target.id==='vendor-search'){state.query=e.target.value;renderVendors()}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});window.addEventListener('hashchange',()=>{if(state.openedVendor)closeModal();parseHash();render()});render()}
  window.TripApp={bootstrap};
})();
</script>

</head>
<body>
  <div id="app"><div class="boot"><span class="boot-mark">W<span>·</span>T</span><p>正在整理你的旅程…</p></div></div>
  <script>window.TripApp.bootstrap();</script>
  <noscript><p style="padding:30px;text-align:center">此网页需要启用 JavaScript 才能显示日程。</p></noscript>
</body>
</html>
