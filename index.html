    <div class="modal-section"><div class="modal-key">拜访地点</div>${places.length?places.map(p=>`<div class="visit-place"><b>${esc(p.label)}</b><div class="modal-val">${esc(p.address)}</div>${mapActions(p)}</div>`).join(''):`<div class="modal-val">${v.city==='待定位'?'城市与详细地址待商家回复。':'已知片区：'+esc(b.area)+'；详细地址待补充。'}</div>`}${places.length?'<p class="fine-print map-hint">出发前请与商家确认厂门或展厅入口。</p>':''}</div>
    ${section('联系与预约',b.progress)}
    <div class="vendor-action"><div class="modal-key">出发前要做</div><div class="modal-val">${esc(b.action)}</div></div>
    ${b.note?section('补充说明',b.note):''}${v.contact?section('联系电话',v.contact):''}
    ${actions?`<div class="modal-actions">${actions}</div>`:''}
    <details class="vendor-sources"><summary>资料来源与核对记录</summary>${section('原记录名称',v.name)}${v.addressType?section('地址依据',v.addressType):''}${v.note?section('核对记录',v.note):''}${sources.map(source=>`<p class="fine-print"><a href="${esc(source.url)}" target="_blank" rel="noopener noreferrer">${esc(source.label)}</a></p>`).join('')}</details></div>`;
    r.classList.add('open');document.body.style.overflow='hidden';r.querySelector('.modal').focus();
  }
  function closeModal(){const m=document.getElementById('vendor-modal');if(m){m.classList.remove('open');m.innerHTML=''}state.openedVendor=null;document.body.style.overflow='';}
  // Configure only a site-owned, public Tencent URI client identifier after approval.
  // Never use a sample key, a server credential, or an arbitrary string as this value.
  const tencentMapOptions={uriReferer:"2YRBZ-TN4C3-BAC3P-RAUHH-FXSFS-YFFBL"};
  function mapURL(keyword,region){return 'https://apis.map.qq.com/uri/v1/search?keyword='+enc(keyword)+(region?'&region='+enc(region):'')+'&referer='+enc(tencentMapOptions.uriReferer||'work-trip-2026')}
  function tencentAppDestination(place,options=tencentMapOptions){
    const referer=String(options.uriReferer||'').trim(),name=String(place.name||place.address||'').trim();
    if(!referer||!name)return null;
    const point=place.point;
    const located=point?.verified===true&&point.crs==='gcj02'&&typeof point.lat==='number'&&Number.isFinite(point.lat)&&point.lat>=-90&&point.lat<=90&&typeof point.lng==='number'&&Number.isFinite(point.lng)&&point.lng>=-180&&point.lng<=180;
    const query=new URLSearchParams({referer});
    if(located){query.set('type','drive');query.set('fromcoord','CurrentLocation');query.set('to',name);query.set('tocoord',point.lat+','+point.lng);
    if(/^\d+$/.test(String(point.uid||'')))query.set('touid',String(point.uid))}
    else{query.set('keyword',name);if(place.city)query.set('region',place.city)}
    return {href:'qqmap://map/'+(located?'routeplan':'search')+'?'+query.toString(),label:located?'腾讯地图导航':'在腾讯地图App中找地点',located};
  }
  function mapActions(place){
    const appLink=tencentAppDestination(place),copyText=place.address||[place.city,place.name].filter(Boolean).join(' ');
    return `<div class="place-actions">${appLink?`<a class="text-button map-app-link" href="${esc(appLink.href)}">${icon('pin','sm')} ${esc(appLink.label)}</a>`:''}<a class="text-button" href="${mapURL(place.name||copyText,place.city)}" target="_blank" rel="noopener noreferrer">${icon('pin','sm')} 腾讯地图网页版</a><button type="button" class="text-button" data-copy="${esc(copyText)}">${icon('copy','sm')} 复制地址</button></div>${appLink?'<p class="fine-print map-hint">若未打开App，请在Safari或系统浏览器重试，也可复制地址后在地图中粘贴。</p>':''}`;
  }
  function showToast(message){const t=document.getElementById('toast');if(!t)return;t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
  async function copy(str){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(str)}else{const ta=document.createElement('textarea');ta.value=str;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}showToast('已复制')}catch(e){showToast('复制未成功，可长按内容手动复制')}}
  async function share(){if(location.protocol==='file:'){showToast('这是本地预览，部署后才能复制分享网址');return}const opts={title:D.meta.title,text:'2026年10月21日—11月11日同行行程',url:location.href};try{if(navigator.share&&/Android|iPhone|iPad/i.test(navigator.userAgent)){await navigator.share(opts)}else await copy(location.href)}catch(e){if(e.name!=='AbortError')await copy(location.href)}}
  function navigate(page,date){if(date)state.date=date;state.page=page;history.replaceState(null,'',`#/${page}${page==='days'?'/'+state.date:''}`);render();window.scrollTo({top:0,behavior:'instant'})}
  function routesView(){
    const routeDays=[['2026-10-27','27日 · 大沥','广交会收尾 → 富轩（下午可选）→ 逸扉酒店'],['2026-10-28','28日 · 狮山','盈加与大浩湖的先后，待大浩湖定位落实后确认。'],['2026-10-29','29日 · 高明—白坭—西樵','目标4家、保底3家；跨江顺序和接待时间出发前再确认。']];
    return `<div class="title-head"><div><div class="eyebrow">FOSHAN · THREE-DAY ROUTES</div><h1>三天看厂地图</h1><p>10月27—29日叠加查看；点地图上的地点，可看主营和地址。</p></div></div><div class="route-pending"><strong>28日第②站：<button type="button" data-vendor="25">大浩湖原木门</button> · 定位待补</strong><br>仍在拜访候选中。已有地址：佛山市狮山镇横兴路1号；精确定位未确认，因此暂未在图上落点。</div><iframe class="route-map-frame" id="foshan-route-frame" src="foshan-routes.html?v=1.0.27" title="佛山三天路线互动地图" loading="eager"></iframe><a class="ghost-link route-open-link" href="foshan-routes.html?v=1.0.27" target="_blank" rel="noopener">单独打开大图 ${icon('arrow','sm')}</a><p class="route-stay"><strong>住宿已确定：佛山王府井紫薇港逸扉酒店。</strong>禅城区季华四路68号一座；10/27入住、10/30退房，共3晚。地图连线只表示拜访顺序，实际驾车请使用各地点的腾讯地图导航。</p><div class="route-days">${routeDays.map(([date,title,note])=>{const day=D.days.find(d=>d.date===date);return `<section class="route-day"><h2>${esc(title)}</h2>${day.suppliers.map((id,i)=>{const v=D.suppliers.find(v=>v.id===id);return `<button type="button" class="route-stop${id==='25'?' route-stop-pending':''}" data-vendor="${esc(id)}"><b>${['①','②','③','④'][i]} ${esc(v.name)}${id==='25'?' · 定位待补':''}</b><small>${esc(v.product||v.category||v.business||'查看主营与地址')}</small></button>`}).join('')}<p>${esc(note)}</p><button class="text-button" data-goto-day="${date}">查看当天行程 ${icon('arrow','sm')}</button></section>`}).join('')}</div>`;
  }
  window.addEventListener('message',event=>{const frame=document.getElementById('foshan-route-frame');if(frame&&event.source===frame.contentWindow&&event.origin===location.origin&&event.data?.type==='foshan-route-height'&&Number.isFinite(event.data.height)){frame.style.height=Math.max(650,Math.min(2600,event.data.height))+'px'}});
  function render(){let body=state.page==='days'?dayView():state.page==='vendors'?vendorsView():state.page==='bookings'?bookingsView():state.page==='routes'?routesView():overView();pageShell(body);if(state.page==='vendors')renderVendors();if(state.page==='days'){const sel=document.querySelector('.day-pill.selected');sel?.scrollIntoView({block:'nearest',inline:'center'})}}
  function parseHash(){const match=location.hash.match(/^#\/(overview|days|vendors|routes|bookings)(?:\/(\d{4}-\d{2}-\d{2}))?/);if(match){state.page=match[1];if(match[2]&&D.days.find(x=>x.date===match[2]))state.date=match[2]}}
  function delegatedClick(e){
    if(e.target.classList.contains('modal-wrap')){closeModal();return}
    const el=e.target.closest('[data-page],[data-share],[data-goto-day],[data-date],[data-vendor],[data-filter],[data-close],[data-copy]');if(!el)return;
    if(el.hasAttribute('data-close')){closeModal();return}
    if(el.hasAttribute('data-copy')){copy(el.getAttribute('data-copy'));return}
    if(el.hasAttribute('data-share')){share();return}
    if(el.hasAttribute('data-vendor')){modalVendor(el.getAttribute('data-vendor'));return}
    if(el.hasAttribute('data-filter')){state.city=el.getAttribute('data-filter');document.querySelectorAll('[data-filter]').forEach(x=>{const yes=x.getAttribute('data-filter')===state.city;x.classList.toggle('active',yes);x.setAttribute('aria-pressed',String(yes))});renderVendors();return}
    if(el.hasAttribute('data-date')){state.date=el.getAttribute('data-date');history.replaceState(null,'',`#/days/${state.date}`);const display=document.getElementById('selected-day');if(display)display.innerHTML=renderDay(D.days.find(x=>x.date===state.date));document.querySelectorAll('[data-date]').forEach(x=>{x.classList.toggle('selected',x.getAttribute('data-date')===state.date);x.classList.toggle('active',x.getAttribute('data-date')===state.date)});document.querySelector('.day-pill.selected')?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});document.getElementById('selected-day')?.scrollIntoView({block:'start',behavior:'smooth'});return}
    if(el.hasAttribute('data-goto-day')){navigate('days',el.getAttribute('data-goto-day'));return}
    if(el.hasAttribute('data-page')){e.preventDefault();navigate(el.getAttribute('data-page'));return}
  }
  function bootstrap(){app=document.getElementById('app'); if(!app){throw new Error('缺少网页容器 #app');} if(!window.TRIP_DATA){app.innerHTML='<div class="load-error">未能读取行程数据，请确认trip-data.js存在。</div>';return}D=window.TRIP_DATA;parseHash();document.addEventListener('click',delegatedClick);document.addEventListener('input',e=>{if(e.target.id==='vendor-search'){state.query=e.target.value;renderVendors()}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});window.addEventListener('hashchange',()=>{if(state.openedVendor)closeModal();parseHash();render()});render()}
  window.TripApp={bootstrap};
})();
</script>
